name: Build and Verify Services

on:
  pull_request:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Checkout portalasig-ms-site repository
        uses: actions/checkout@v3

      - name: Clone and build portalasig-commons
        run: |
          git clone --branch master https://github.com/portalasig-microservices/portalasig-commons.git
          cd portalasig-commons
          mvn clean install

      - name: Clone and build portalasig-ms-notify
        run: |
          git clone --branch develop https://github.com/portalasig-microservices/portalasig-ms-notify.git
          cd portalasig-ms-notify
          mvn clean install

      - name: Clone and build portalasig-ms-uaa
        run: |
          git clone --branch develop https://github.com/portalasig-microservices/portalasig-ms-uaa.git
          cd portalasig-ms-uaa
          mvn clean install

      - name: Checkstyle code quality analysis
        run: mvn checkstyle:check

      - name: Run unit and integration tests
        run: mvn test

      - name: Generate code coverage report with JaCoCo
        continue-on-error: true
        run: mvn jacoco:report

      - name: Verify minimum code coverage threshold
        continue-on-error: true
        run: |
          echo "Verifying JaCoCo coverage threshold (70% lines, 60% branches)..."
          mvn verify

      - name: Build and verify portalasig-ms-site
        run: mvn clean verify
